name: release

# On a `v*` tag: build the reproducible microVM kernel, sign its content hash with
# the ES256 kernel-signing key (an Actions Secret; its public half ships built into
# boatramp), and publish the kernel + detached signature + hash as Release assets.
# boatramp's default `compute.default_kernel` points at the latest release, and
# verifies the download against the pinned hash + signature before booting it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    name: build, sign & publish vmlinux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 kernel (the KVM embedded VMM) on an x86_64 runner; aarch64 kernel
          # (the macOS Virtualization.framework `vmm-vz` backend) on an arm64 runner.
          # `nix build .#vmlinux` builds the running system's arch (the flake is
          # per-system), so each runner produces its own kernel natively.
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build the microVM kernel
        run: |
          nix build .#vmlinux --print-build-logs
          test -f result/vmlinux
          # Dereference the store symlink into a writable, well-named asset.
          install -m 0644 result/vmlinux boatramp-vmlinux-${{ matrix.arch }}
          file boatramp-vmlinux-${{ matrix.arch }}

      - name: Sign the kernel hash
        env:
          KERNEL_SIGNING_KEY: ${{ secrets.KERNEL_SIGNING_KEY }}
        run: |
          if [ -z "$KERNEL_SIGNING_KEY" ]; then
            echo "::error::KERNEL_SIGNING_KEY secret is not set" >&2
            exit 1
          fi
          # Emits boatramp-vmlinux-<arch>.sha256 and .sig; prints the derived public
          # key so the log can be cross-checked against BOATRAMP_KERNEL_SIGNING_PUBKEY.
          cargo run --release --manifest-path tools/kernel-sign/Cargo.toml \
            -- boatramp-vmlinux-${{ matrix.arch }}

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            boatramp-vmlinux-${{ matrix.arch }}
            boatramp-vmlinux-${{ matrix.arch }}.sha256
            boatramp-vmlinux-${{ matrix.arch }}.sig
          body: |
            Reproducible microVM kernels for boatramp's VMM backends: the `x86_64`
            kernel boots the Linux/KVM embedded VMM; the `aarch64` kernel boots the
            macOS Virtualization.framework (`vmm-vz`) backend (a raw arm64 `Image`).

            Verify before use (per arch):

            ```sh
            sha256sum -c <(printf '%s  boatramp-vmlinux-<arch>\n' "$(cat boatramp-vmlinux-<arch>.sha256)")
            ```

            Each `.sig` is a detached ES256 (`r‖s`, hex) signature over the SHA-256
            **hex string**, verifiable against boatramp's built-in kernel-signing
            public key. boatramp checks both before booting the kernel.
